---
- name: Configure Prometheus Alerting
  hosts: monitoring
  become: true

  tasks:

    - name: Create Prometheus rules directory
      file:
        path: /etc/prometheus/rules
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure alert rules
      copy:
        dest: /etc/prometheus/rules/kubeops-alerts.yml
        owner: root
        group: root
        mode: '0644'
        content: |
          groups:
            - name: kubeops-alerts
              rules:

                - alert: NodeDown
                  expr: up{job="kubeops-nodes"} == 0
                  for: 1m
                  labels:
                    severity: critical
                  annotations:
                    summary: "Node is down"
                    description: "{% raw %}{{ $labels.server }}{% endraw %} is unreachable by Prometheus."

                - alert: KubernetesPodNotRunning
                  expr: kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1
                  for: 2m
                  labels:
                    severity: warning
                  annotations:
                    summary: "Kubernetes pod is not running"
                    description: "Pod {% raw %}{{ $labels.namespace }}/{{ $labels.pod }}{% endraw %} is not running."

    - name: Configure Prometheus Alertmanager and rules
      blockinfile:
        path: /etc/prometheus/prometheus.yml
        marker: "# {mark} KUBEOPS ALERTING"
        block: |
          rule_files:
            - /etc/prometheus/rules/*.yml

          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                      - 'localhost:9093'

    - name: Validate Prometheus configuration
      command: promtool check config /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Validate Prometheus alert rules
      command: promtool check rules /etc/prometheus/rules/kubeops-alerts.yml
      changed_when: false

    - name: Restart Prometheus
      systemd:
        name: prometheus
        state: restarted
