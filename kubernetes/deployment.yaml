apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: demo-app
          image: harbor.kubeops.local/kubeops/demo-app:latest
          ports:
            - containerPort: 80
